      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #ffffff;
        font-family: Georgia;
        color: #000000;
      }
      .container-box {
        margin: 8px 16px 8px 16px;
        padding: 12px;
        border-radius: 16px;
        line-height: 0.95;
        width: fit-content;
        height: fit-content;
        z-index: 2;
        backdrop-filter: blur(3px);
        background: #ffffffaa;
        box-shadow: 2px 3px 10px #aaaaaa44;
        position: relative;
        pointer-events: auto;
      }
      .more-opaque {
        backdrop-filter: blur(6px);
        background-color: #ffffffee;
      }
      #deck-container {
        width: 100vw;
        height: 100vh;  
      }
      #deck-container canvas {
        z-index: 1;
        background: #ffffff;
      }
      .deck-tooltip {
          
            font-size: 0.8em;
            font-family: Georgia;
            font-weight: 300;
            color: #000000 !important;
            background-color: #ffffffee !important;
            border-radius: 12px;
            backdrop-filter: blur(6px);
            box-shadow: 2px 3px 10px #aaaaaa44;
            max-width: 25%;
      }
      input {
        margin: 2px;
        padding: 4px;
        border-radius: 8px;
        color: #000000;
        background: #ffffffdd;
        border: 2px inset #77777744;
        transition: 0.5s;
        outline: none;
        box-sizing: border-box;
      }
      input:focus {
        border: 2px inset #555;
      }
      #search-container{
        width: fit-content;
      }

          self.postMessage({ data: parsedData });
        } else {
          // Send the parsed table back to the main thread
          self.postMessage({ type: "data", data: binaryData });
        }
      }
    `], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(parsingWorkerBlob);
    const searchItemId = "text-search";
    const histogramItemId = "d3histogram-container";
    const selectionItemId = "lasso-select";
    const searchItem = document.getElementById(searchItemId);
    let histogramItem = null;
    
    const container = document.getElementById('deck-container');

    const labelDataWorker = new Worker(workerUrl);
    const pointDataWorker = new Worker(workerUrl);
    const metaDataWorker = new Worker(workerUrl);
    
    const colorDataWorker = new Worker(workerUrl);
    

    const datamap = new DataMap({
      container: container,
      bounds: [-13.21784283657358, 13.179198800914408, -11.869418318129167, 11.55655544226837],
      searchItemId: searchItemId,
      lassoSelectionItemId: selectionItemId,      
    });

    function updateProgressBar(id, progress) {
      const progressBar = document.querySelector(`#${id} .datamapplot-progress-bar-fill`);
      const progressText = document.querySelector(`#${id} .datamapplot-progress-bar-text`);
      progressBar.style.width = `${progress}%`;
      progressText.textContent = `${id.replace('-progress', '').replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}: ${progress}%`;
    }

    function checkAllDataLoaded() {
      const progressBars = document.querySelectorAll('.datamapplot-progress-bar-fill');
      const allLoaded = Array.from(progressBars).every(bar => bar.style.width === '100%');
      if (allLoaded) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("progress-container").style.display = "none";
      }
    }

    function loadPointDataLayer() {
      pointDataWorker.postMessage({encodedData: pointDataEncoded, JSONParse: false});

      pointDataWorker.onmessage = async function(event) {
        if (event.data.type === "progress") {
          updateProgressBar('point-data-progress', event.data.progress);
        } else {
          const { data } = event.data;
          
          const pointData = await simpleArrowParser(data);
          
          datamap.addPoints(
            pointData,
            {
              pointSize: -1,
              pointOutlineColor: [250, 250, 250, 128],
              pointLineWidth: 0.001,
              pointHoverColor: [170, 0, 0, 187],
              pointLineWidthMaxPixels: 3,
              pointLineWidthMinPixels: 0.001,
              pointRadiusMaxPixels: 14,
              pointRadiusMinPixels: 0.01,
            }
          );

          document.getElementById("loading").style.display = "none";
          updateProgressBar('point-data-progress', 100);
          checkAllDataLoaded();}
      };

      
      colorDataWorker.postMessage({encodedData: colorDataEncoded, JSONParse: false});

      colorDataWorker.onmessage = async function(event) {
        if (event.data.type === "progress") {
          updateProgressBar('color-data-progress', event.data.progress);
          // console.log("Color data progress: ", event.data.progress);
        } else {
          const { data } = event.data;
          
          const colorData = await simpleArrowParser(data);
          

          document.getElementById("loading").style.display = "none";
          updateProgressBar('color-data-progress', 100);
          checkAllDataLoaded();

          const colorMapContainer = document.getElementById("colormap-selector-container");
          const legendContainer = document.getElementById("legend-container");
          
          const colorMaps = [{"field": "none", "description": "Clusters", "colors": ["#d3a0d6", "#d89a58", "#3e8c54", "#c55e92", "#70aac3"], "kind": "categorical"}, {"field": "ratio", "description": "walk against Sophocles (log2 rate ratio)", "colors": ["#053061", "#073467", "#09386d", "#0c3d73", "#0e4179", "#10457e", "#124984", "#144e8a", "#175290", "#195696", "#1b5a9c", "#1d5fa2", "#1f63a8", "#2267ac", "#246aae", "#276eb0", "#2a71b2", "#2c75b4", "#2f79b5", "#327cb7", "#3480b9", "#3783bb", "#3a87bd", "#3c8abe", "#3f8ec0", "#4291c2", "#4695c4", "#4c99c6", "#529dc8", "#59a1ca", "#5fa5cd", "#65a9cf", "#6bacd1", "#71b0d3", "#78b4d5", "#7eb8d7", "#84bcd9", "#8ac0db", "#90c4dd", "#96c7df", "#9bc9e0", "#a0cce2", "#a5cee3", "#a9d1e5", "#aed3e6", "#b3d6e8", "#b8d8e9", "#bddbea", "#c2ddec", "#c7e0ed", "#cce2ef", "#d1e5f0", "#d4e6f1", "#d7e8f1", "#dae9f2", "#ddebf2", "#e0ecf3", "#e3edf3", "#e6eff4", "#e9f0f4", "#ecf2f5", "#eff3f5", "#f2f5f6", "#f5f6f7", "#f7f5f4", "#f8f3f0", "#f8f1ed", "#f9efe9", "#f9ede5", "#faeae1", "#fae8de", "#fbe6da", "#fbe4d6", "#fce2d2", "#fcdfcf", "#fdddcb", "#fddbc7", "#fcd7c2", "#fcd3bc", "#fbceb7", "#facab1", "#f9c6ac", "#f9c2a7", "#f8bda1", "#f7b99c", "#f7b596", "#f6b191", "#f5ac8b", "#f5a886", "#f3a481", "#f19e7d", "#ef9979", "#ec9374", "#ea8e70", "#e8896c", "#e58368", "#e37e64", "#e17860", "#de735c", "#dc6e57", "#da6853", "#d7634f", "#d55d4c", "#d25849", "#cf5246", "#cc4c44", "#c94741", "#c6413e", "#c43b3c", "#c13639", "#be3036", "#bb2a34", "#b82531", "#b61f2e", "#b3192c", "#ae172a", "#a81529", "#a21328", "#9c1127", "#960f27", "#900d26", "#8a0b25", "#840924", "#7f0823", "#790622", "#730421", "#6d0220", "#67001f"], "kind": "continuous", "nColors": 5, "valueRange": [-4.235237539972217, 6.9126624352700095]}, {"field": "henry", "description": "Henry's words", "colors": ["#e15759", "#dddddd"], "kind": "categorical", "nColors": 5, "showLegend": true, "colorMapping": {"used by Henry": "#e15759", "not used by Henry": "#dddddd"}}];
          const colorSelector = new ColormapSelectorTool(
            colorMaps,
            colorMapContainer,
            colorData,
            legendContainer,
            datamap,
          );
          datamap.colorSelector = colorSelector;
        }
      };
      
    }

    function loadLabelDataLayer() {
      labelDataWorker.postMessage({encodedData: labelDataEncoded, JSONParse: true});

      labelDataWorker.onmessage = async function(event) {
        if (event.data.type === "progress") {
          updateProgressBar('label-data-progress', event.data.progress);
        } else {
          const { data } = event.data;
          const labelData = data;
          datamap.labelData = labelData;
          // Only build labels where we have a position.
          datamap.addLabels(labelData, {
            labelTextColor: d => [d.r, d.g, d.b],
            textMinPixelSize: 12,
            textMaxPixelSize: 28,
            textOutlineWidth: 8,
            textOutlineColor: [238, 238, 238, 221],
            textBackgroundColor: [255, 255, 255, 64],
            fontFamily: "Georgia",
            fontWeight: 600,
            lineSpacing: 0.95,
            textCollisionSizeScale: 3,
            pickable: false,
          });

          
          
          datamap.addBoundaries(labelData.filter((d) => {
                return d.polygon
            }), {
            clusterBoundaryLineWidth: 1,
          });
          
          document.getElementById("loading").style.display = "none";
          updateProgressBar('label-data-progress', 100);
          checkAllDataLoaded();
        }
      };
    }

    function loadMetaData() {
      metaDataWorker.postMessage({encodedData: hoverDataEncoded, JSONParse: true});

      metaDataWorker.onmessage = async function(event) {
        if (event.data.type === "progress") {
          updateProgressBar('meta-data-progress', event.data.progress);
        } else {
          const { data } = event.data;
          const hoverData = data;
          datamap.addMetaData(hoverData, {
            tooltipFunction: ({index, picked, layer}) => picked ? {"html": `<div><b style='font-size:1.3em'>${hoverData.hover_text[index]}</b><br>topic: <i>${hoverData.topic[index]}</i><br>per 1000 topic lemmata: Sophocles ${hoverData.rate_sophocles[index]}, walk ${hoverData.rate_walk[index]} (log2 ratio ${hoverData.ratio[index]})<br>in Henry's restoration: ${hoverData.henry[index]}</div>`} : null,
            onClickFunction: null,
            searchField: "hover_text",
          });

          
          /* Search */
          searchItem.addEventListener("input", debounce(event => datamap.searchText(event.target.value)));
          updateProgressBar('meta-data-progress', 100);
          checkAllDataLoaded();
        }
      };
    }

    
    loadPointDataLayer();
    loadLabelDataLayer();
    loadMetaData();</script>
</html>
